name: Apply validated SEO hierarchy
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-validated-seo-hierarchy
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check and apply reviewed patch
        run: |
          echo "660ee7761fcad9680405933d836f6e4313eb266ff527dab94df9d8fd3aab26c9  .github/seo-authority-update.patch" | sha256sum --check
          git apply --check --whitespace=nowarn .github/seo-authority-update.patch
          git apply --index --whitespace=nowarn .github/seo-authority-update.patch
      - name: Install dependencies
        run: npm ci
      - name: Validate ownership and content
        run: |
          python3 scripts/verify-page-authority.py
          python3 scripts/verify-seo-contract.py
          python3 scripts/verify-keyword-locks.py
          python3 scripts/verify-sitemap.py
      - name: Validate production build
        run: npm run build
      - name: Commit validated site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(seo): align all supporting pages to core service owners"
          git push origin HEAD:main
