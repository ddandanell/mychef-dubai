name: Validate sitemap
on:
  push:
    branches: [main]
    paths:
      - 'public/sitemap.xml'
      - 'scripts/verify-sitemap.py'
      - 'scripts/generate-sitemap.ts'
      - 'scripts/ryze-convert.mjs'
      - 'vercel.json'
      - 'docs/seo/parked-urls.json'
      - '.github/workflows/sitemap-validation.yml'
  pull_request:
    paths:
      - 'public/sitemap.xml'
      - 'scripts/verify-sitemap.py'
      - 'scripts/generate-sitemap.ts'
      - 'scripts/ryze-convert.mjs'
      - 'vercel.json'
      - 'docs/seo/parked-urls.json'
      - '.github/workflows/sitemap-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-sitemap.py
