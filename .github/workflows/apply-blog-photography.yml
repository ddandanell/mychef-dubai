name: Apply validated blog photography
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-validated-blog-photography
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed photography changes
        run: |
          echo "3b9e56347540ed072de17ae30066b893edcec81dac09ecf15671e551449fc214  .github/blog-photography-update.patch" | sha256sum --check
          git apply --check --whitespace=nowarn .github/blog-photography-update.patch
          git apply --index --whitespace=nowarn .github/blog-photography-update.patch
      - name: Install dependencies
        run: npm ci
      - name: Validate photography and SEO ownership
        run: |
          python3 scripts/verify-blog-photography.py
          python3 scripts/verify-page-authority.py
          python3 scripts/verify-seo-contract.py
          python3 scripts/verify-keyword-locks.py
      - name: Validate production build
        run: npm run build
      - name: Commit validated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(blog): curate photography and polish all 85 article experiences"
          git push origin HEAD:main
