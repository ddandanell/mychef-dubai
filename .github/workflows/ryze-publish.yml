name: Ryze publish

on:
  workflow_dispatch:
  push:
    paths:
      - "blog/data/**"
      - "scripts/ryze-convert.mjs"
      - "scripts/verify-blog-ownership.py"
      - "scripts/test-blog-ownership.py"
      - "scripts/queue-ryze-imports.py"
      - "scripts/daily-supporting-blogs.py"
      - "scripts/test-daily-supporting-blogs.py"
      - "scripts/generate-blog-archives.py"
      - "scripts/verify-blog-framework.py"
      - "blog/publishing-policy.json"
      - "blog/publishing-ledger.json"
      - "src/content/pageAuthority.json"
      - "src/content/blogPhotography.json"

concurrency:
  group: ryze-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site packages
        run: npm ci

      - name: Convert Ryze articles
        run: |
          python3 scripts/test-blog-ownership.py
          python3 scripts/test-daily-supporting-blogs.py
          node scripts/ryze-convert.mjs

      - name: Verify core money-page ownership
        run: python3 scripts/verify-page-authority.py

      - name: Validate sitemap XML and canonical URLs
        run: python3 scripts/verify-sitemap.py

      - name: Verify the site builds
        env:
          VERCEL: "1"
        run: |
          npm run build:prerender
          python3 scripts/verify-seo-contract.py
          python3 scripts/verify-keyword-locks.py
          python3 scripts/verify-page-authority.py --rendered
          python3 scripts/verify-blog-photography.py --rendered
          python3 scripts/verify-public-pages.py
          python3 scripts/verify-blog-framework.py --rendered
          node scripts/test-site-navigation.mjs
          node scripts/test-pricing-ui.mjs

      - name: Commit generated pages
        run: |
          git add blog/data docs/seo/myCHEF-AE-SEO-STANDARD.json src/content/pageAuthority.json src/content/keywordLocks.ts src/content/breadcrumbTrails.ts api/e.ts src/content/ryze-pages src/content/ryzeBlogPaths.ts src/content/ryzeBlogPosts.ts src/content/blogPlanningLinks.json src/content/blogRelatedOverrides.json public/sitemap.xml blog/publishing-checklists.json blog/topic-inventory.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Ryze articles [skip ci]"
          git push
