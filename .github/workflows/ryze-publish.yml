name: Ryze publish

on:
  push:
    paths:
      - "blog/data/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site packages
        run: npm ci

      - name: Convert Ryze articles
        run: node scripts/ryze-convert.mjs

      - name: Verify the site builds
        run: npm run build

      - name: Commit generated pages
        run: |
          git add src/content/ryze-pages src/content/ryzeBlogPaths.ts src/content/ryzeBlogPosts.ts public/sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Ryze articles [skip ci]"
          git push
