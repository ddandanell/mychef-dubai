<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-site-verification" content="50_l9HYClequ5r7RR7vt_Wb6PJyCfFx32udN2y-kgWA" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />

    <!--
      Reveal fail-safe (part 1 of 2 — see src/lib/revealFailsafe.ts).
      Runs before any bundle is fetched. Marking <html class="js"> lets the
      stylesheet keep .opacity-0 content VISIBLE whenever JavaScript never
      arrives (crawlers, JS disabled, bundle 404, blocked script). Without
      this, ~123 pages render every heading and paragraph at opacity:0 and
      the page looks completely blank.
    -->
    <script>document.documentElement.classList.add('js')</script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://wa.me">
    <link rel="preload" as="image" href="/images/home-hero.webp" type="image/webp" fetchpriority="high">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000' rx='4'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='serif' font-size='18' font-weight='600' fill='%23C8A45C'%3Em%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
