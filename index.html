<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-site-verification" content="50_l9HYClequ5r7RR7vt_Wb6PJyCfFx32udN2y-kgWA" />
    <!--
      Second verification owner: the service account the SEO board reads with
      (googlenay@trusty-bearing-489316-k1.iam.gserviceaccount.com). Google accepts one tag
      per owner, so this sits alongside the tag above rather than replacing it. It is what
      lets the board pull Search Console clicks, impressions and positions per query.
    -->
    <meta name="google-site-verification" content="yyE9A6k2_Ceyrg1TRzFkOzgoGzWg1t8a2UKI61Lassw" />
    <meta name="theme-color" content="#000000" />

    <!--
      Reveal fail-safe (part 1 of 2 — see src/lib/revealFailsafe.ts).
      Runs before any bundle is fetched. Marking <html class="js"> lets the
      stylesheet keep .opacity-0 content VISIBLE whenever JavaScript never
      arrives (crawlers, JS disabled, bundle 404, blocked script). Without
      this, ~123 pages render every heading and paragraph at opacity:0 and
      the page looks completely blank.
    -->
    <script>document.documentElement.classList.add('js')</script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://wa.me">
    <!-- Fonts load non-render-blocking (swap shows fallback instantly, then swaps in). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"></noscript>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000' rx='4'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='serif' font-size='18' font-weight='600' fill='%23C8A45C'%3Em%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
