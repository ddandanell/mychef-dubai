<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-site-verification" content="50_l9HYClequ5r7RR7vt_Wb6PJyCfFx32udN2y-kgWA" />
    <!--
      Second verification owner: the service account the SEO board reads with
      (googlenay@trusty-bearing-489316-k1.iam.gserviceaccount.com). Google accepts one tag
      per owner, so this sits alongside the tag above rather than replacing it. It is what
      lets the board pull Search Console clicks, impressions and positions per query.
    -->
    <meta name="google-site-verification" content="yyE9A6k2_Ceyrg1TRzFkOzgoGzWg1t8a2UKI61Lassw" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="myCHEF" />
    <meta name="apple-mobile-web-app-title" content="myCHEF" />
    <meta property="og:site_name" content="myCHEF" />
    <title>myCHEF Dubai — Private Chef &amp; Catering</title>
    <style>html,body,#root{background:#000;color:#fff}</style>

    <!--
      Reveal fail-safe (part 1 of 2 — see src/lib/revealFailsafe.ts).
      Runs before any bundle is fetched. Marking <html class="js"> lets the
      stylesheet keep .opacity-0 content VISIBLE whenever JavaScript never
      arrives (crawlers, JS disabled, bundle 404, blocked script). Without
      this, ~123 pages render every heading and paragraph at opacity:0 and
      the page looks completely blank.
    -->
    <script>document.documentElement.classList.add('js')</script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://wa.me">
    <!-- Fonts load non-render-blocking (swap shows fallback instantly, then swaps in). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"></noscript>

    <!-- Favicon must be a crawlable URL. Data-URI icons are ignored by Google. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="https://web-grower.vercel.app/wg.js" data-wg-key="c2222222-2222-4222-8222-222222222222" data-wg-origin="https://web-grower.vercel.app" defer></script>
    <script async src="https://px.get-ryze.ai/px.js" data-key="rz_pk_62845a9403981b30e4e0af47f93ec6e2"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const storageKey = 'mychef_google_ads_attribution'
        const labels = {
          'yacht-catering': 'Yacht Catering',
          'yacht-chef': 'Yacht Chef',
          'yacht-party-catering': 'Yacht Party Catering',
        }

        const readAttribution = () => {
          const params = new URLSearchParams(window.location.search)
          const current = {
            source: params.get('utm_source') || '',
            medium: params.get('utm_medium') || '',
            campaign: params.get('utm_campaign') || '',
            content: params.get('utm_content') || '',
            term: params.get('utm_term') || '',
            gclid: params.get('gclid') || '',
          }
          const isGoogleAd = current.source === 'google' || current.medium === 'cpc' || Boolean(current.gclid)
          if (isGoogleAd) {
            try { sessionStorage.setItem(storageKey, JSON.stringify(current)) } catch {}
            return current
          }
          try {
            return JSON.parse(sessionStorage.getItem(storageKey) || 'null')
          } catch {
            return null
          }
        }

        const enrichWhatsAppLinks = () => {
          const attribution = readAttribution()
          if (!attribution || (!attribution.source && !attribution.gclid)) return
          document.querySelectorAll('a[href*="wa.me/"]').forEach((link) => {
            try {
              const url = new URL(link.href)
              const message = url.searchParams.get('text') || ''
              if (message.includes('Source: Google Ads')) return
              const detail = [
                '',
                'Source: Google Ads',
                attribution.content ? `Ad group: ${labels[attribution.content] || attribution.content}` : '',
                attribution.term ? `Search: ${attribution.term}` : '',
                attribution.gclid ? `Google reference: ${attribution.gclid}` : '',
              ].filter(Boolean).join('\n')
              url.searchParams.set('text', `${message}\n${detail}`)
              link.href = url.toString()
            } catch {}
          })
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', enrichWhatsAppLinks, { once: true })
        } else {
          enrichWhatsAppLinks()
        }
        new MutationObserver(enrichWhatsAppLinks).observe(document.documentElement, { childList: true, subtree: true })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
